<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>FormWizard_v10</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="author" content="Best.com">
      <link rel="stylesheet" href="css/fontes\iconesFontes.css">
      <link rel="stylesheet" href="css/datepicker.min.css">
      <link rel="stylesheet" href="css/estiloCliente.css">
      <meta name="robots" content="noindex, follow">
   </head>
   <body>
      <div class="wrapper">
         <form action id="wizard">
            <h4></h4>
            <section>
               <div class="inner">
                  <a href="#" class="avartar">
                  <img src="imagem/avartar.png" alt>
                  </a>
                  <div class="form-row form-group">
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Nome">
                     </div>
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Sobrenome">
                     </div>
                  </div>
                  <div class="form-row">
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="CPF">
                        <i class="zmdi zmdi-assignment-account small"></i>
                     </div>
                  </div>
				<div class="form-row">
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="CNPJ">
                        <i class="zmdi zmdi-assignment-account small"></i>
                     </div>
                  </div>
                  <div class="form-row">
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Email">
                        <i class="zmdi zmdi-email small"></i>
                     </div>
                  </div>
                  <div class="form-row">
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Celular">
                        <i class="zmdi zmdi-smartphone-android"></i>
                     </div>
                  </div>
               </div>
            </section>
            <h4></h4>
            <section>
               <div class="inner">
                  <a href="#" class="avartar">
                  <img src="imagem/avartar.png" alt>
                  </a>
                  <div class="form-row">
                     <div class="select">
                        <div class="form-holder">
                           <div class="select-control">Genero</div>
                           <i class="zmdi zmdi-caret-down small"></i>
                        </div>
                        <ul class="dropdown">
                           <li rel="Masculino">Masculino</li>
                           <li rel="Feminino">Feminino</li>
                           <li rel="prefiroNDeclarar">Prefiro não declarar</li>
                        </ul>
                     </div>
                  </div>
                  <div class="form-row">
                     <div class="select">
                        <div class="form-holder">
                           <div class="select-control">Idiomas Conhecidos</div>
                           <i class="zmdi zmdi-caret-down small"></i>
                        </div>
                        <ul class="dropdown">
                           <li rel="Ingles">Ingles</li>
                           <li rel="Frances">Frances</li>
                           <li rel="Outros">Outros</li>
                        </ul>
                     </div>
                  </div>
				  				<div class="form-row">
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Outra Linguagem">
                        <i class="zmdi zmdi-map small"></i>
                     </div>
                  </div>
                  <div class="form-row">
                     <div class="form-holder">
                        <input type="text" class="form-control datepicker-here" data-language="ja" data-date-format="yyyy/mm/dd"  id="dp1" placeholder="Data de nascimento">
                     </div>
                  </div>
                  <div class="form-row form-group">
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Twitter">
                        <i class="zmdi zmdi-twitter small"></i>
                     </div>
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Linked In">
                        <i class="zmdi zmdi-linkedin small"></i>
                     </div>
                  </div>
                  <div class="form-row form-group">
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Facebook">
                        <i class="zmdi zmdi-facebook small"></i>
                     </div>
                     <div class="form-holder">
                        <input type="text" class="form-control" placeholder="Google">
                        <i class="zmdi zmdi-google small"></i>
                     </div>
                  </div>
               </div>
            </section>          
         </form>
      </div>
      <script src="js/jquery-3.3.1.min.js"></script>
      <script src="js/jquery.steps.js"></script>
      <script src="js/datepicker.js"></script>
      <script src="js/datepicker.idioma.js"></script>
      <script src="js/main.js"></script>
      <script type="text/javascript" async="" src="https://www.google-analytics.com/analytics.js"></script>
   </body>
</html>
